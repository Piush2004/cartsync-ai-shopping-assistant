# Render Blueprint for apps/api. Import this file in the Render dashboard
# ("New" -> "Blueprint") to provision the backend web service and its
# Postgres database together. See DEPLOYMENT.md for the full walkthrough,
# including which env vars need a value pasted in after import.
#
# Reference: https://render.com/docs/blueprint-spec

databases:
  - name: cartsync-db
    plan: free

services:
  - type: web
    name: cartsync-api
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install -r requirements.txt
    # Runs after buildCommand, before startCommand, on every deploy --
    # applies any new Alembic migrations before the new code starts serving
    # traffic. See apps/api/alembic/.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # Auto-generated by Render on creation -- no action needed. Must be a
      # real random value in production; apps/api/core/config.py's dev-only
      # fallback (persisted to a gitignored local file) doesn't survive
      # Render's ephemeral filesystem across deploys.
      - key: SECRET_KEY
        generateValue: true
      # Shared secret for local-compute/ worker processes calling
      # /api/v1/compute/*. Auto-generated; only relevant if you later run a
      # local-compute node against this deployed backend.
      - key: WORKER_API_KEY
        generateValue: true
      # Required for the Virtual Try-On feature (routers/vton.py). Get this
      # from https://fal.ai/dashboard/keys after signing up. Requests fail
      # with an honest "not configured" error until this is set -- nothing
      # else breaks.
      - key: FAL_API_KEY
        sync: false
      # Set this to your Vercel frontend's URL once it's deployed (e.g.
      # https://your-app.vercel.app). Until then, cross-origin requests from
      # the frontend are rejected by design -- see core/config.py's comment
      # on why allow_origins=["*"] is never used here.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Wires the backend to the Postgres database defined above instead of
      # SQLite -- see apps/api/database.py's comment on why SQLite doesn't
      # survive a redeploy on most hosting platforms.
      - key: SQLALCHEMY_DATABASE_URL
        fromDatabase:
          name: cartsync-db
          property: connectionString
